# ============================================================
# 테스트 전용 프로파일 (@ActiveProfiles("test"))
# 실제 MySQL 없이 인메모리 H2로 ApplicationContext 로딩을 검증한다.
# MODE=MySQL → 엔티티의 LONGTEXT/TEXT 컬럼 정의를 H2가 그대로 수용
# NON_KEYWORDS=USER,VALUE → 예약어와 겹치는 테이블/컬럼명(user 등) 허용
# create-drop → 시작 시 엔티티로부터 스키마 생성 (AdminConfigService 초기화 쿼리 대비)
# ============================================================

spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER,VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=never

# 테스트용 더미 시크릿 (실제 값 아님)
jwt.secret=SW5oYUNhdGNoU2VjcmV0S2V5Rm9ySldUQXV0aDIwMjZWZXJ5U2VjdXJlIQ==
gemini.api.key=test-key
kakao.client-id=test-client-id
