spring.application.name=inha-catch-server
# 1. 데이터베이스 연결 정보 (본인의 DB 이름과 비밀번호로 수정하세요)
spring.datasource.url=jdbc:mysql://localhost:3306/inha_catch?serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=rootroot

# JPA 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 포트 설정 (기본 8080)
server.port=8080