spring.application.name=inha-catch-server

# 프로필 활성화 (local | dev | prod)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# .env 파일 자동 로드 (서버 cwd 기준 inha-catch-server/.env)
spring.config.import=optional:file:./.env[.properties]

# ============================================================
# 모든 시크릿은 .env(gitignored) 또는 환경변수에서 주입.
# 시크릿 기본값을 절대 이 파일에 넣지 말 것. git에 커밋되면 영구 노출됨.
# 운영: 환경변수 (JWT_SECRET, GEMINI_API_KEY, DB_PASSWORD 등)
# ============================================================

# JPA 공통 설정
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# 포트
server.port=${SERVER_PORT:8080}

# DB (환경변수 우선)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/inha_catch?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT Secret — .env 또는 시스템 환경변수에서 주입 (필수, 미설정 시 기동 실패)
jwt.secret=${JWT_SECRET}

# Gemini API Key — 환경변수 필수
gemini.api.key=${GEMINI_API_KEY:}

# Kakao OAuth — 환경변수 또는 local 파일
kakao.client-id=${KAKAO_CLIENT_ID:}
kakao.redirect-uri=${KAKAO_REDIRECT_URI:}

# 잡알리오 (공공기관 채용정보 OpenAPI) — 공공데이터포털 인증키
jobalio.api.key=${JOBALIO_API_KEY:}
jobalio.api.base-url=${JOBALIO_API_BASE_URL:https://opendata.alio.go.kr}

# 초기 관리자 계정 — .env 또는 시스템 환경변수에서 주입 (선택)
admin.init.email=${ADMIN_INIT_EMAIL:}
admin.init.password=${ADMIN_INIT_PASSWORD:}
admin.init.name=${ADMIN_INIT_NAME:관리자}

# 요청 크기 제한
server.tomcat.max-http-form-post-size=1048576
server.tomcat.connection-timeout=20000

# Actuator — /actuator/health 공개, 나머지는 ADMIN 접근(아래 SecurityConfig에서 제어)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

# CORS — 운영에서는 환경변수로 정확한 도메인만 등록 (wildcard 금지)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://10.0.2.2:*,http://127.0.0.1:*}

# Firebase FCM (gitignored json 파일 경로)
firebase.config.file=${FIREBASE_CONFIG_FILE:firebase-service-account.json}
