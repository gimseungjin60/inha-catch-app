spring.application.name=inha-catch-server

spring.profiles.active=local

# DB 연결 설정
spring.datasource.url=jdbc:mysql://localhost:3306/inha_catch?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=rootroot
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# SQL 초기화
spring.sql.init.mode=never

# JPA 설정
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 포트 설정 (기본 8080)
server.port=8080

# JWT Secret (Base64 인코딩, 최소 256bit) - 환경변수 우선, 없으면 기본값 사용
jwt.secret=${JWT_SECRET:SW5oYUNhdGNoU2VjcmV0S2V5Rm9ySldUQXV0aDIwMjZWZXJ5U2VjdXJlIQ==}

# Gemini API - 환경변수 우선
gemini.api.key=${GEMINI_API_KEY:AIzaSyB0N4bo6ZOx7OssX91e52xIbc4n1nqizv4}

# 요청 크기 제한
server.tomcat.max-http-form-post-size=1048576
server.tomcat.connection-timeout=20000

# Kakao OAuth
kakao.client-id=${KAKAO_CLIENT_ID:YOUR_KAKAO_REST_API_KEY}
kakao.redirect-uri=${KAKAO_REDIRECT_URI:https://auth.expo.io/@your-expo-username/InhaCatch}

# CORS (터널 URL 포함)
cors.allowed-origins=http://localhost:*,http://10.0.2.2:*,http://127.0.0.1:*,http://172.20.10.*:*,https://*.loca.lt

# Firebase (FCM 푸시 알림)
firebase.config.file=firebase-service-account.json
