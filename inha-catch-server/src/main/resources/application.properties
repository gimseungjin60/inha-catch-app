spring.application.name=inha-catch-server

spring.profiles.active=local

# .env 파일 자동 로드 (서버 cwd 기준 inha-catch-server/.env)
spring.config.import=optional:file:./.env[.properties]

# JPA 설정
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 포트 설정 (기본 8080)
server.port=${SERVER_PORT:8080}

# JWT Secret — .env 또는 시스템 환경변수에서 주입 (필수)
jwt.secret=${JWT_SECRET}

# 초기 관리자 계정 — .env 또는 시스템 환경변수에서 주입 (선택)
admin.init.email=${ADMIN_INIT_EMAIL:}
admin.init.password=${ADMIN_INIT_PASSWORD:}
admin.init.name=${ADMIN_INIT_NAME:관리자}

# 요청 크기 제한
server.tomcat.max-http-form-post-size=1048576
server.tomcat.connection-timeout=20000

# Actuator — /actuator/health 공개, 나머지는 ADMIN 접근(아래 SecurityConfig에서 제어)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
