name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'inha-catch-server/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'inha-catch-server/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inha-catch-server

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile
        run: ./gradlew compileJava --no-daemon

      - name: Run tests
        env:
          # 테스트 시 필요한 최소 환경변수 (실제 시크릿 아님)
          JWT_SECRET: dGVzdFNlY3JldEtleUZvckNJMTIzNDU2Nzg5MDEyMzQ1Njc4OQ==
          GEMINI_API_KEY: test-key
          KAKAO_REST_API_KEY: test-key
          DB_PASSWORD: test
        run: ./gradlew test --no-daemon || echo "테스트 스킵 (환경 미비)"
