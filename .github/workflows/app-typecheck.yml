name: App Typecheck

on:
  push:
    branches: [main, develop]
    paths:
      - 'inha-catch-app/**'
      - '.github/workflows/app-typecheck.yml'
  pull_request:
    paths:
      - 'inha-catch-app/**'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inha-catch-app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: inha-catch-app/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript check
        run: npx tsc --noEmit --skipLibCheck
